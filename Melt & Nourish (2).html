<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title id="pg-title">Melt &amp; Nourish</title><meta id="pg-meta" name="claude:viewport-fit-sides" content="cover"><link id="pg-font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600&amp;display=swap"><style id="app-style">
/* Layout: sticky cream header, left-aligned hero beside a shelf of 2L jugs, filterable catalog grid, about and contact bands. Owner edits live in a side drawer. */
:root{
  --bg:#F5ECD7; --bg-2:#EDE0C0; --surface:#FBF6E8; --line:#DACBA6;
  --ink:#2C281F; --muted:#6E6350; --accent:#3D6650; --accent-ink:#FBF6E8;
  --butter:#E9C46A; --danger:#A23B2E;
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root{--line:#DACBA6}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.note{background:var(--butter);font-size:14px}
.note .wrap{padding-block:8px}

.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:16px;min-height:64px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand img{height:40px;width:auto;max-width:150px;object-fit:contain;display:block}
.brand .mark{width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.brand .mark svg{width:18px;height:18px;fill:var(--accent-ink)}
.brand b{font:800 1.2rem/1.1 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.nav a{text-decoration:none;font-weight:500;padding:8px 12px;border-radius:999px}
.nav a:hover{background:var(--bg-2)}

.hero{padding-block:clamp(28px,6vw,72px)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(24px,5vw,56px);align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);margin-bottom:14px}
.hero h1{font-weight:800;font-size:clamp(2.2rem,6.2vw,4.1rem);line-height:1.02}
.hero p.lead{margin-top:18px;font-size:1.1rem;color:var(--muted);max-width:46ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.shelf{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:12px;background:var(--bg-2);border:1px solid var(--line);border-radius:22px;padding:34px 18px 0;min-height:280px;overflow:hidden}
.shelf::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--line)}
.tile{position:relative;z-index:1;margin-bottom:16px;min-width:0}
.tile.t0{width:30%}.tile.t1{width:36%}.tile.t2{width:27%}
.tile img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;display:block;border:1px solid var(--line)}
.tile svg{width:100%;height:auto;display:block}
.shelf:has(.tile:only-child) .tile{width:44%}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:999px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none;cursor:pointer;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--bg-2);filter:none}
.btn.sm{min-height:36px;padding:6px 14px;font-size:.92rem}
.btn[disabled],.btn.off{opacity:.5;cursor:not-allowed;filter:none}
.btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}
.btn.danger.on{background:var(--danger);color:var(--surface)}

.band{padding-block:clamp(32px,5vw,56px)}
.band.alt{background:var(--bg-2);border-block:1px solid var(--line)}
.sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sec-head h2{font-size:clamp(1.6rem,3.6vw,2.2rem);font-weight:800}
.count{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.tools input[type=search]{flex:1 1 220px;min-width:0;max-width:340px;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:36px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ph{position:relative;aspect-ratio:1/1;background:var(--bg-2);display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg{width:58%;height:auto}
.card.out .ph>*:not(.badge){filter:grayscale(.8);opacity:.7}
.badge{position:absolute;top:10px;left:10px;background:var(--butter);color:var(--ink);font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px}
.bd{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px;flex:1;min-width:0}
.cat{font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.bd h3{font-size:1.15rem;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.desc{color:var(--muted);font-size:.95rem;overflow-wrap:anywhere}
.foot{margin-top:auto;padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.price{font:700 1.15rem var(--display);font-variant-numeric:tabular-nums}
.empty{grid-column:1/-1;padding:32px 0;color:var(--muted)}

.about{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(20px,5vw,56px)}
.about h2{font-size:clamp(1.6rem,3.6vw,2.2rem);font-weight:800}
.about p{white-space:pre-line;max-width:62ch;font-size:1.05rem}
.contact{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.contact h2{font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800}
.cval{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cval span.lbl{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.cval strong{font:700 1.3rem var(--display);overflow-wrap:anywhere;user-select:all}
.ftr{padding-block:22px;color:var(--muted);font-size:.9rem}
.ftr .wrap{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}

/* Owner editor */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;box-shadow:0 8px 24px rgba(44,40,31,.25);background:var(--ink);border-color:var(--ink);color:var(--surface)}
.fab i{width:9px;height:9px;border-radius:50%;background:var(--butter);display:none}
.fab.dirty i{display:inline-block}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);z-index:50;background:var(--surface);border-left:1px solid var(--line);box-shadow:-14px 0 40px rgba(44,40,31,.2);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dr-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
.dr-top h2{font-size:1.25rem;font-weight:800}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:1.4rem;line-height:1;cursor:pointer}
.tabs{display:flex;gap:6px;padding-block:10px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;min-height:40px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:600;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dr-body{flex:1;overflow-y:auto;padding-block:16px;display:flex;flex-direction:column;gap:14px}
.dr-foot{border-top:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.dr-foot .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
#ed-msg{min-height:1.3em;font-size:.9rem;color:var(--muted)}
#ed-msg.err{color:var(--danger)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.fld .lb{font-size:.85rem;font-weight:600}
.fld small{color:var(--muted);font-size:.82rem}
.fld input[type=text],.fld input[type=number],.fld input[type=url],.fld textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
.fld textarea{resize:vertical;min-height:96px}
.chk{display:flex;gap:10px;align-items:center;min-height:36px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.up{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.up .pv{width:72px;height:72px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);display:grid;place-items:center;overflow:hidden;flex:none}
.up .pv img{width:100%;height:100%;object-fit:cover}
.up .pv svg{width:70%}
.up input[type=file]{max-width:100%;font-size:.9rem}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);flex-wrap:wrap}
.pthumb{width:48px;height:48px;border-radius:8px;overflow:hidden;background:var(--bg-2);display:grid;place-items:center;flex:none}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pthumb svg{width:70%}
.pinfo{flex:1 1 120px;min-width:0;display:flex;flex-direction:column}
.pinfo strong{overflow-wrap:anywhere}
.pinfo span{font-size:.85rem;color:var(--muted)}
.pbtns{display:flex;gap:6px;flex-wrap:wrap}
.pbtns .btn{min-height:34px;padding:4px 12px;font-size:.88rem}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.meta span{font-variant-numeric:tabular-nums;font-weight:600}
.hint{font-size:.88rem;color:var(--muted)}

@media (max-width:820px){
  .hero .wrap,.about{grid-template-columns:minmax(0,1fr)}
  .shelf{min-height:220px}
}
@media (max-width:520px){
  .nav a{padding:8px 8px}
  .hdr .wrap{gap:8px}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.chip,.nav a{transition:background-color .15s,filter .15s}
}

     '<div class="tools"><label class="sr" for="q">Cari produk</label><input id="q" type="search" placeholder="Cari produk" value="'+esc(fQ)+'" autocomplete="off"><div class="chips" id="chips"></div></div>'+
     '<div class="grid" id="grid"></div>'+
   '</div></section>'+
   '<section class="band" id="tentang" style="scroll-margin-top:72px"><div class="wrap about"><h2>'+esc(b.aboutTitle||'Tentang kami')+'</h2><p>'+esc(b.aboutText)+'</p></div></section>'+
   '<section class="band alt" id="kontak" style="scroll-margin-top:72px"><div class="wrap">'+contactHTML+'</div></section>'+
   '<footer class="ftr"><div class="wrap"><span>&copy; '+new Date().getFullYear()+' '+esc(b.name)+'</span>'+(b.footerNote?'<span>'+esc(b.footerNote)+'</span>':'')+'</div></footer>';
  renderGrid();
}

function renderGrid(){
  var s=cur(),ps=s.products,order=safeUrl(s.brand.orderUrl);
  var cats=[];
  ps.forEach(function(p){var c=String(p.cat||'').trim();if(c&&cats.indexOf(c)<0)cats.push(c)});
  if(fCat&&cats.indexOf(fCat)<0)fCat='';
  var q=fQ.trim().toLowerCase();
  var list=[];
  ps.forEach(function(p,i){
    var okC=!fCat||String(p.cat||'').trim()===fCat;
    var okQ=!q||(p.name+' '+p.desc+' '+p.cat).toLowerCase().indexOf(q)>=0;
    if(okC&&okQ)list.push([p,i]);
  });
  var chips=$('#chips'),grid=$('#grid'),count=$('#count');
  if(!grid)return;
  chips.innerHTML=cats.length?['']
    .concat(cats).map(function(c){return '<button class="chip" type="button" data-cat="'+esc(c)+'" aria-pressed="'+(c===fCat)+'">'+(c?esc(c):'Semua')+'</button>'}).join(''):'';
  count.textContent=(list.length===ps.length?ps.length+' produk':list.length+' dari '+ps.length+' produk');
  if(!list.length){
    grid.innerHTML='<p class="empty">'+(ps.length?'Belum ada produk yang cocok dengan pencarian.':'Produk akan segera tersedia.')+'</p>';
    return;
  }
  grid.innerHTML=list.map(function(x){
    var p=x[0],i=x[1],url=safeUrl(p.url)||order,price=money(p.price);
    var action=p.soldOut?'<span class="btn sm off" aria-disabled="true">Habis</span>':(url?'<a class="btn sm" href="'+esc(url)+'" target="_blank" rel="noopener">Pesan</a>':'<a class="btn sm ghost" href="#kontak" data-go="kontak">Tanya</a>');
    return '<article class="card'+(p.soldOut?' out':'')+'"><div class="ph">'+visual(p,i)+(p.soldOut?'<span class="badge">Stok habis</span>':'')+'</div><div class="bd">'+
      (p.cat?'<span class="cat">'+esc(p.cat)+'</span>':'')+'<h3>'+esc(p.name)+'</h3>'+(p.desc?'<p class="desc">'+esc(p.desc)+'</p>':'')+
      '<div class="foot"><span class="price">'+(price||'Tanya harga')+'</span>'+action+'</div></div></article>';
  }).join('');
}

root.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');
  if(g){
    e.preventDefault();
    var id=g.getAttribute('data-go');
    if(id==='top'){window.scrollTo({top:0,behavior:smooth})}
    else{var el=document.getElementById(id);if(el)el.scrollIntoView({behavior:smooth,block:'start'})}
    return;
  }
  var c=e.target.closest('[data-cat]');
  if(c){fCat=c.getAttribute('data-cat');renderGrid();return}
  var cb=e.target.closest('[data-copy]');
  if(cb){
    var txt=cb.getAttribute('data-copy');
    var done=function(){cb.textContent='Tersalin';setTimeout(function(){cb.textContent='Salin'},1500)};
    var sel=function(){var n=document.getElementById('cval');if(n){var r=document.createRange();r.selectNodeContents(n);var sl=getSelection();sl.removeAllRanges();sl.addRange(r)}};
    try{navigator.clipboard.writeText(txt).then(done,sel)}catch(_){sel()}
  }
});
root.addEventListener('input',function(e){
  if(e.target.id==='q'){fQ=e.target.value;renderGrid()}
});

/* ---------- Owner editor ---------- */
var dr=null,fab=null;
function touch(){
  dirty=true;confirmDiscard=false;
  if(fab)fab.classList.add('dirty');
  schedule();
}
function cp(){return draft&&draft.products.filter(function(p){return p.id===pview})[0]}
function msg(t,err){var m=$('#ed-msg');if(m){m.textContent=t||'';m.className=err?'err':''}}
function thumbOf(p,i){var im=safeImg(p.img);return im?'<img src="'+im+'" alt="">':jug(i,p.name)}

function fld(id,label,val,attrs,hint){

function area(id,label,val,attrs,hint){

function storeForm(){

    '<div class="chk"><input id="ed-showname" type="checkbox" data-b="showName" '+(b.showName!==false?'checked':'')+'><label for="ed-showname">Show store name next to the logo</label></div>'+
    fld('ed-name','Store name',b.name,'data-b="name"')+
    fld('ed-tagline','Small line above the headline',b.tagline,'data-b="tagline"')+
    fld('ed-hero','Headline',b.heroTitle,'data-b="heroTitle"')+
    area('ed-herotext','Short description under the headline',b.heroText,'data-b="heroText" rows="3"')+
    fld('ed-abouttitle','About title',b.aboutTitle,'data-b="aboutTitle"')+
    area('ed-abouttext','About text',b.aboutText,'data-b="aboutText" rows="6"','Blank lines start a new paragraph.')+
    fld('ed-orderlabel','Order button text',b.orderLabel,'data-b="orderLabel"')+
    fld('ed-orderurl','Order link (Shopee, WhatsApp, etc.)',b.orderUrl,'data-b="orderUrl" inputmode="url"','Used by every product that has no link of its own.')+
    fld('ed-clabel','Contact label',b.contactLabel,'data-b="contactLabel"')+
    fld('ed-cvalue','Contact number or handle',b.contactValue,'data-b="contactValue"')+
    fld('ed-foot','Footer note',b.footerNote,'data-b="footerNote"');

function productsPane(){
  var ps=draft.products,n=ps.length;
  if(pview!=='list'){
    var p=cp();
    if(!p){pview='list'}
    else{
      var i=ps.indexOf(p),im=safeImg(p.img);
      var cats=[];ps.forEach(function(q){var c=String(q.cat||'').trim();if(c&&cats.indexOf(c)<0)cats.push(c)});
      return '<div class="meta"><button class="btn ghost sm" type="button" data-act="back">&larr; All products</button><span>'+(i+1)+' / '+n+'</span></div>'+
        fld('ed-p-name','Product name',p.name,'data-p="name"')+
        '<div class="fld"><label for="ed-p-price">Price (Rp)</label><input id="ed-p-price" type="number" min="0" step="500" inputmode="numeric" data-p="price" value="'+esc(p.price)+'"><small>Leave empty to show &ldquo;Tanya harga&rdquo;.</small></div>'+
        '<div class="fld"><label for="ed-p-cat">Category</label><input id="ed-p-cat" type="text" list="ed-cats" data-p="cat" value="'+esc(p.cat)+'" autocomplete="off"><datalist id="ed-cats">'+cats.map(function(c){return '<option value="'+esc(c)+'">'}).join('')+'</datalist><small>Customers can filter by category.</small></div>'+
        area('ed-p-desc','Description',p.desc,'data-p="desc" rows="4"')+
        '<div class="fld"><span class="lb">Photo</span><div class="up"><div class="pv">'+thumbOf(p,i)+'</div><div><input id="ed-img-file" type="file" accept="image/*"><div style="margin-top:8px">'+(im?'<button class="btn ghost sm" type="button" data-act="rm-img">Remove photo</button>':'')+'</div></div></div><small>Without a photo the card shows a jerrycan drawing.</small></div>'+
        fld('ed-p-url','Order link for this product (optional)',p.url,'data-p="url" inputmode="url"','Overrides the store order link.')+
        '<div class="chk"><input id="ed-p-out" type="checkbox" data-p="soldOut" '+(p.soldOut?'checked':'')+'><label for="ed-p-out">Sold out</label></div>'+
        '<div><button class="btn danger'+(confirmDel===p.id?' on':'')+'" type="button" data-act="del" data-id="'+esc(p.id)+'">'+(confirmDel===p.id?'Tap again to delete':'Delete product')+'</button></div>';
    }
  }
  return '<div class="meta"><span>'+n+' / '+MAX+' products</span><button class="btn sm" type="button" data-act="add" '+(n>=MAX?'disabled':'')+'>Add product</button></div>'+
    (n>=MAX?'<p class="hint">The catalog is full. Delete a product to add another.</p>':'')+
    (n?'<ul class="plist">'+ps.map(function(p,i){
      var del=confirmDel===p.id;
      return '<li class="prow"><div class="pthumb">'+thumbOf(p,i)+'</div><div class="pinfo"><strong>'+esc(p.name||'Untitled')+'</strong><span>'+(money(p.price)||'No price')+(p.cat?' &middot; '+esc(p.cat):'')+(p.soldOut?' &middot; sold out':'')+'</span></div>'+
        '<div class="pbtns"><button class="btn ghost" type="button" data-act="edit" data-id="'+esc(p.id)+'">Edit</button>'+
        '<button class="btn ghost" type="button" data-act="up" data-id="'+esc(p.id)+'" aria-label="Move up" '+(i===0?'disabled':'')+'>&uarr;</button>'+
        '<button class="btn ghost" type="button" data-act="down" data-id="'+esc(p.id)+'" aria-label="Move down" '+(i===n-1?'disabled':'')+'>&darr;</button>'+
        '<button class="btn danger'+(del?' on':'')+'" type="button" data-act="del" data-id="'+esc(p.id)+'">'+(del?'Confirm':'Delete')+'</button></div></li>';
    }).join('')+'</ul>':'<p class="hint">No products yet. Add your first one.</p>');
}
function drawerHTML(){
  return '<div class="dr-top pad"><h2>Edit store</h2><button class="x" id="ed-close" type="button" data-act="close" aria-label="Close editor">&times;</button></div>'+
    '<div class="tabs pad" role="tablist"><button type="button" role="tab" data-tab="store" aria-selected="'+(tab==='store')+'">Store</button><button type="button" role="tab" data-tab="products" aria-selected="'+(tab==='products')+'">Products ('+draft.products.length+'/'+MAX+')</button></div>'+
    '<div class="dr-body pad" id="ed-body">'+(tab==='store'?storeForm():productsPane())+'</div>'+
    '<div class="dr-foot pad"><p id="ed-msg" role="status"></p><div class="row"><button class="btn ghost" type="button" data-act="discard">'+(confirmDiscard?'Tap again to discard':'Discard changes')+'</button><button class="btn" type="button" data-act="publish" id="ed-publish">Publish changes</button></div></div>';
}
function refreshDrawer(keepScroll){
  var body=$('#ed-body'),st=(keepScroll&&body)?body.scrollTop:0;
  dr.innerHTML=drawerHTML();
  var nb=$('#ed-body');if(nb)nb.scrollTop=st;
}
function openEditor(){
  if(!draft){draft=JSON.parse(JSON.stringify(saved));dirty=false}
  editing=true;tab='store';pview='list';confirmDel='';confirmDiscard=false;
  refreshDrawer(false);
  dr.hidden=false;fab.hidden=true;
  renderStore();
  var c=$('#ed-close');if(c)c.focus();
}
function closeEditor(){
  dr.hidden=true;fab.hidden=false;editing=false;
  fab.classList.toggle('dirty',dirty);
  renderStore();
}
function readImage(file,max,type){
  return new Promise(function(res,rej){
    if(!file)return rej(new Error('No file chosen'));
    if(file.type==='image/svg+xml'){
      if(file.size>200000)return rej(new Error('SVG is too large (max 200 KB).'));
      var r=new FileReader();
      r.onload=function(){res(r.result)};r.onerror=function(){rej(new Error('Could not read this file.'))};
      r.readAsDataURL(file);return;
    }
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var sc=Math.min(1,max/Math.max(im.width,im.height));
      var w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc));
      var c=document.createElement('canvas');c.width=w;c.height=h;
      var x=c.getContext('2d');
      if(type==='jpeg'){x.fillStyle='#FBF6E8';x.fillRect(0,0,w,h)}
      x.drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);
      res(c.toDataURL(type==='jpeg'?'image/jpeg':'image/png',0.82));
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('This image format is not supported. Try JPG or PNG.'))};
    im.src=url;
  });
}
function buildDoc(state){
  var reset='';
  var styles=document.head?document.head.querySelectorAll('style'):[];
  for(var k=0;k<styles.length;k++){
    var t=styles[k].textContent||'';
    if(styles[k].id!=='app-style'&&t.indexOf('safe-area-inset')>=0&&t.indexOf('color-scheme')>=0){reset=t;break}
  }
  if(!reset)reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  var g=function(id){return document.getElementById(id).outerHTML};
  var json=JSON.stringify(state).split('<').join('\\u003c').split(String.fromCharCode(8232)).join('\\u2028').split(String.fromCharCode(8233)).join('\\u2029');
  var code=document.getElementById('app-code').textContent;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    g('pg-title')+g('pg-meta')+g('pg-font')+g('app-style')+'<div id="root"></div>'+
    '<script type="application/json" id="store-data">'+json+'<\/script>'+
    '<script id="app-code">'+code+'<\/script></body></html>';
}
async function publish(){
  var d=draft;
  if(!String(d.brand.name||'').trim()){tab='store';refreshDrawer(false);msg('Enter a store name first.',true);return}
  var bad=d.products.filter(function(p){return !String(p.name||'').trim()})[0];
  if(bad){tab='products';pview=bad.id;refreshDrawer(false);msg('Give this product a name before publishing.',true);return}
  if(d.products.length>MAX){msg('The catalog can hold at most '+MAX+' products.',true);return}
  var out=JSON.parse(JSON.stringify(d));out.sample=false;
  var btn=$('#ed-publish');btn.disabled=true;msg('Publishing…');
  try{
    await artifactNS.publish(buildDoc(out));
    msg('Published. Reloading…');
  }catch(e){
    btn.disabled=false;
    var c=e&&e.code;
    if(c==='conflict')msg('Someone else saved first. The page is reloading to the latest version.',true);
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='not_declared')msg('This view cannot save changes. Open the page from your own account.',true);
    else if(c==='too_large')msg('The page is too large. Remove a few photos or use smaller images.',true);
    else if(c==='rate_limited')msg('Saving too often. Wait a moment and try again.',true);
    else msg('Could not save. Try again in a moment.',true);
  }
}
function mountAdmin(){
  fab=document.createElement('button');
  fab.type='button';fab.id='ed-fab';fab.className='btn fab';
  fab.innerHTML='Edit store <i></i>';
  fab.addEventListener('click',openEditor);
  dr=document.createElement('aside');
  dr.className='dr';dr.hidden=true;dr.setAttribute('aria-label','Edit store');
  document.body.appendChild(fab);document.body.appendChild(dr);

  dr.addEventListener('input',function(e){
    var t=e.target;
    if(t.getAttribute('data-b')){
      draft.brand[t.getAttribute('data-b')]=t.type==='checkbox'?t.checked:t.value;touch();
    }else if(t.getAttribute('data-p')){
      var p=cp();if(!p)return;
      var k=t.getAttribute('data-p');
      p[k]=k==='price'?(t.value===''?'':Math.max(0,Number(t.value))):(t.type==='checkbox'?t.checked:t.value);
      touch();
    }
  });
  dr.addEventListener('change',async function(e){
    var t=e.target,f=t.files&&t.files[0];
    if(t.id==='ed-logo-file'&&f){
      try{draft.brand.logo=await readImage(f,420,'png');touch();refreshDrawer(true);msg('')}catch(err){msg(err.message,true)}
    }else if(t.id==='ed-img-file'&&f){
      var p=cp();if(!p)return;
      try{p.img=await readImage(f,720,'jpeg');touch();refreshDrawer(true);msg('')}catch(err2){msg(err2.message,true)}
    }
  });
  dr.addEventListener('click',function(e){
    var tb=e.target.closest('[data-tab]');
    if(tb){tab=tb.getAttribute('data-tab');pview='list';confirmDel='';refreshDrawer(false);return}
    var a=e.target.closest('[data-act]');
    if(!a||a.disabled)return;
    var act=a.getAttribute('data-act'),id=a.getAttribute('data-id'),ps=draft.products;
    var idx=ps.findIndex(function(p){return p.id===id});
    if(act!=='del')confirmDel='';
    if(act!=='discard')confirmDiscard=false;
    if(act==='close'){closeEditor()}
    else if(act==='rm-logo'){draft.brand.logo='';touch();refreshDrawer(true)}
    else if(act==='rm-img'){var p=cp();if(p){p.img='';touch();refreshDrawer(true)}}
    else if(act==='add'){
      if(ps.length>=MAX){msg('The catalog is full ('+MAX+').',true);return}
      var np={id:'p'+Math.random().toString(36).slice(2,9),name:'Produk baru',price:'',cat:'',desc:'',img:'',url:'',soldOut:false};
      ps.push(np);pview=np.id;touch();refreshDrawer(false);
      var nm=$('#ed-p-name');if(nm){nm.focus();nm.select()}
    }
    else if(act==='edit'){pview=id;refreshDrawer(false)}
    else if(act==='back'){pview='list';refreshDrawer(false)}
    else if(act==='up'&&idx>0){var u=ps[idx];ps[idx]=ps[idx-1];ps[idx-1]=u;touch();refreshDrawer(true)}
    else if(act==='down'&&idx>=0&&idx<ps.length-1){var d2=ps[idx];ps[idx]=ps[idx+1];ps[idx+1]=d2;touch();refreshDrawer(true)}
    else if(act==='del'){
      if(confirmDel===id){ps.splice(idx,1);confirmDel='';if(pview===id)pview='list';touch();refreshDrawer(true)}
      else{confirmDel=id;refreshDrawer(true)}
    }
    else if(act==='discard'){
      if(!dirty){draft=null;closeEditor();return}
      if(confirmDiscard){draft=null;dirty=false;confirmDiscard=false;fab.classList.remove('dirty');closeEditor()}
      else{confirmDiscard=true;refreshDrawer(true)}
    }
    else if(act==='publish'){publish()}
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&dr&&!dr.hidden)closeEditor()});
}
async function initAdmin(){
  try{
    var cl=window.claude;
    if(!cl||!cl.use)return;
    var r=await Promise.all([cl.use('artifact'),cl.use('user')]);
    artifactNS=r[0];
    if(!artifactNS||!r[1])return;
    canEdit=await r[1].canEdit();
    if(canEdit){mountAdmin();renderStore()}
  }catch(e){}
}

renderStore();
initAdmin();
})();
